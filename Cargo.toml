[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/data",
    "crates/parse",
    "crates/match",
    "crates/wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/your-org/explainshell-wasm"
description = "explainshell compiled to WebAssembly with TypeScript API"
categories = ["command-line-utilities", "parsing", "webassembly"]
keywords = ["explainshell", "wasm", "webassembly", "shell", "bash", "manpage"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.1"
thiserror = "1.0"
anyhow = "1.0"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true